name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish or refresh a release for (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Pull the section between "## [VERSION]" and the next "## [" heading.
          # Also stop at the trailing link-reference block ("[1.0.0]: https://..."),
          # which otherwise gets swallowed by the oldest section's run to EOF.
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1     { found = 1; next }
            found && /^## \[/       { exit }
            found && /^\[[^]]+\]: / { exit }
            found                   { print }
          ' CHANGELOG.md > notes.md

          if grep -q '[^[:space:]]' notes.md; then
            echo "Using hand-written notes for $VERSION."
            echo "AUTO_NOTES=0" >> "$GITHUB_ENV"
          else
            echo "::warning::No CHANGELOG.md section for $VERSION - falling back to auto-generated notes."
            echo "AUTO_NOTES=1" >> "$GITHUB_ENV"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - updating it."
            if [ "$AUTO_NOTES" = "1" ]; then
              gh release edit "$TAG" --title "$TAG"
            else
              gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            fi
          else
            if [ "$AUTO_NOTES" = "1" ]; then
              gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
            else
              gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
            fi
          fi
